apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-ehr-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcare-ehr
  template:
    metadata:
      labels:
        app: healthcare-ehr
    spec:
      containers:
      - name: healthcare-ehr
        image: kp6969/healthcare-ehr-app:latest
        ports:
        - containerPort: 80
        securityContext:
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-ehr-service
spec:
  type: NodePort
  selector:
    app: healthcare-ehr
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30090
